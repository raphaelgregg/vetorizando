<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vetorizando</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5efc'/%3E%3Cpath d='M8 10l8 14 8-14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">V</span> Vetorizando</div>
    <nav class="stepper" aria-label="Etapas">
      <button data-go="1" class="step on"><b>1</b> Enviar</button>
      <button data-go="2" class="step" disabled><b>2</b> Inspecionar</button>
      <button data-go="3" class="step" disabled><b>3</b> Exportar</button>
    </nav>
    <button id="theme" class="icon" aria-label="Alternar tema">☾</button>
  </header>

  <div id="msg" class="msg" role="alert" hidden></div>

  <main>
    <section id="step1" class="panel">
      <label id="drop" class="drop" tabindex="0">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden />
        <div class="drop-icon">⬆</div>
        <h1>Arraste uma imagem aqui</h1>
        <p>ou clique para escolher · ou cole com <kbd>Ctrl</kbd>+<kbd>V</kbd></p>
        <small>PNG, JPG, WebP, GIF ou BMP · até 20&nbsp;MB · processado no seu navegador</small>
      </label>
      <h2 class="sub">Ou teste com um exemplo</h2>
      <div id="samples" class="samples"></div>
    </section>

    <section id="step2" class="panel" hidden>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Visualização">
          <button data-mode="compare" class="on">Antes/Depois</button>
          <button data-mode="vector">Vetor</button>
          <button data-mode="original">Original</button>
        </div>
        <button id="wire" class="tog" aria-pressed="false">Raio‑X</button>
        <div class="seg">
          <button id="zout" aria-label="Menos zoom">−</button>
          <button id="zfit">Ajustar</button>
          <button id="zin" aria-label="Mais zoom">+</button>
        </div>
        <div id="stats" class="stats"></div>
      </div>
      <div id="viewer" class="viewer"></div>
      <div class="bar"><div id="prog" class="prog"><i></i><span></span></div><button id="next" class="primary">Continuar → Exportar</button></div>
    </section>

    <section id="step3" class="panel" hidden>
      <div class="export-grid">
        <div>
          <h2>Tipo de imagem</h2>
          <div id="presets" class="presets"></div>
          <details class="adv">
            <summary>Ajustes avançados</summary>
            <div id="adv" class="advgrid"></div>
          </details>
          <h2>Formato</h2>
          <div id="fmt" class="seg fmt" role="group" aria-label="Formato de saída"></div>
          <p id="fmthint" class="summary"></p>
          <h2>Tamanho</h2>
          <div class="sizebox">
            <label>Unidade
              <select id="unit"><option value="px">px</option><option value="mm">mm</option><option value="cm">cm</option><option value="%">%</option></select>
            </label>
            <label>DPI <input id="dpi" type="number" min="36" max="2400" step="1" value="96" /></label>
            <label>Largura <input id="sw" type="number" min="0.01" step="any" /></label>
            <label>Altura <input id="sh" type="number" min="0.01" step="any" /></label>
          </div>
          <p id="sizeinfo" class="summary"></p>
          <button id="download" class="primary big">Baixar SVG</button>
          <p id="summary" class="summary"></p>
        </div>
        <div id="viewer2" class="viewer small"></div>
      </div>
      <div class="bar"><div id="prog2" class="prog"><i></i><span></span></div><button id="back" class="ghost">← Voltar</button></div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
